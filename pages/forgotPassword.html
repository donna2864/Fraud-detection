<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="/images/fraud-detection (1).png">
  <title>Fraud Detection Project</title>
  <link rel="stylesheet" href="../styles/forgotpassword.css">
</head>
<body>
  <div class="container">
    <div class="left">
      <a href="{{ url_for('login') }}" class="back">&larr; Back to login</a>
      <h2>Forgot your password?</h2>
      <p>Don't worry, happens to all of us. Enter your email below to recover your password</p>

      <form method="POST" action="{{ url_for('forgotPassword') }}">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="team8.fraud@gmail.com" required>
        <button type="submit">Reset Password</button>
      </form>      
    </div>

    <div class="right">
      <img src="../images/forgotpass.jpg" alt="Lock illustration">
    </div>
  </div>
</body>
</html>
